services:
  - type: web
    name: docubridge-backend
    env: python
    plan: starter
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: cd Backend && gunicorn --bind 0.0.0.0:$PORT --workers 4 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
    healthCheckPath: /health
    disk:
      name: docubridge-data
      mountPath: /opt/render/project/src
      sizeGB: 1

